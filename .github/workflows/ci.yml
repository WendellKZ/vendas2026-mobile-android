name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_vendas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_vendas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_NAME: ERP Vendas Completo
      ENVIRONMENT: test
      API_V1_PREFIX: /api/v1
      SECRET_KEY: ci-secret
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_vendas
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/erp_vendas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
