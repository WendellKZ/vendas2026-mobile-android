{% extends 'base.html' %}{% block title %}Novo pedido{% endblock %}{% block content %}<form method="post" class="panel form-grid wide"><h2>Dados iniciais do pedido</h2><label>Cliente<select name="client_id" id="clientSelect" required><option value="">Selecione...</option>{% for c in clients %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></label><label>Endereço de entrega<textarea name="delivery_address" id="deliveryAddress" placeholder="Será preenchido pelo cadastro do cliente, mas pode ser alterado"></textarea></label><label>Observações<textarea name="notes" placeholder="Condições comerciais, prazos, combinações..."></textarea></label><button class="btn btn-primary">Criar pedido</button></form>{% endblock %}
