{% extends 'base.html' %}{% block title %}Produtos{% endblock %}{% block content %}<section class="two-col"><div class="panel"><div class="panel-head"><h2>Catálogo comercial</h2><form><input class="search" name="q" placeholder="Buscar produto ou SKU..." value="{{request.args.get('q','')}}"></form></div><div class="product-grid">{% for p in products %}<article class="product-card"><span>{{p.category or 'Produto'}}</span><h3>{{p.name}}</h3><p>SKU {{p.sku}}</p><b>{{p.price|money}}</b><small>Estoque: {{p.stock}}</small></article>{% endfor %}</div></div><form method="post" class="panel form-grid"><h2>Novo produto</h2><input name="sku" placeholder="SKU" required><input name="name" placeholder="Nome do produto" required><input name="category" placeholder="Categoria"><input name="price" placeholder="Preço ex: 59,90"><input name="stock" type="number" placeholder="Estoque"><button class="btn btn-primary">Salvar produto</button></form></section>{% endblock %}
