{% extends 'base.html' %}{% block title %}Clientes{% endblock %}{% block content %}<section class="two-col"><div class="panel"><div class="panel-head"><h2>Clientes da empresa ativa</h2><form><input class="search" name="q" placeholder="Buscar cliente..." value="{{request.args.get('q','')}}"></form></div><div class="cards-list">{% for c in clients %}<article class="mini-card"><div><h3>{{c.name}}</h3><p>{{c.document}} • {{c.city}}/{{c.state}}<br>{{c.delivery_address}}</p></div><div class="quick"><a href="mailto:{{c.email}}">E-mail</a><a target="_blank" href="https://wa.me/55{{c.phone}}">WhatsApp</a></div></article>{% endfor %}</div></div><form method="post" class="panel form-grid"><h2>Novo cliente</h2><input name="name" placeholder="Nome/Razão social" required><input name="document" placeholder="CNPJ/CPF"><input name="city" placeholder="Cidade"><input name="state" placeholder="UF"><input name="email" placeholder="E-mail"><input name="phone" placeholder="WhatsApp"><textarea name="delivery_address" placeholder="Endereço de entrega"></textarea><button class="btn btn-primary">Salvar cliente</button></form></section>{% endblock %}
