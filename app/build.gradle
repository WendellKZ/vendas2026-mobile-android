plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vendas2026.mobile'
    compileSdk 35


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.vendas2026.mobile'
        minSdk 24
        targetSdk 35
        versionCode 22
        versionName '1.0.0-v22-clean-premium' 
    }
}
