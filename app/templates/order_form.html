{% extends 'base.html' %}
{% block content %}
<div class="topbar"><div class="page-title"><h1>Novo pedido</h1><p>Fluxo comercial com cálculo automático e validação de desconto.</p></div></div>
<div class="card">
  <form method="post" action="/pedidos/novo">
    <div class="form-grid">
      <div class="field"><label>Empresa</label><select name="company_id">{% for company in companies %}<option value="{{ company.id }}">{{ company.name }}</option>{% endfor %}</select></div>
      <div class="field"><label>Filial</label><select name="branch_id">{% for branch in branches %}<option value="{{ branch.id }}">{{ branch.name }}</option>{% endfor %}</select></div>
      <div class="field"><label>Cliente</label><select name="customer_id">{% for customer in customers %}<option value="{{ customer.id }}">{{ customer.name }}</option>{% endfor %}</select></div>
      <div class="field"><label>Vendedor</label><select name="seller_id">{% for seller in sellers %}<option value="{{ seller.id }}">{{ seller.name }} ({{ seller.role }})</option>{% endfor %}</select></div>
      <div class="field"><label>Condição de pagamento</label><select name="payment_condition_id"><option value="">Sem condição</option>{% for payment in payment_conditions %}<option value="{{ payment.id }}">{{ payment.name }}</option>{% endfor %}</select></div>
      <div class="field"><label>Frete</label><input name="freight_value" type="number" step="0.01" value="0" /></div>
    </div>
    <div class="section-title" style="margin-top:18px;"><h2>Itens do pedido</h2><button type="button" id="add-item" class="btn secondary">Adicionar item</button></div>
    <div id="order-items" class="order-items">
      <div class="item-row">
        <div class="field"><label>Produto</label><select name="product_id">{% for product in products %}<option value="{{ product.id }}">{{ product.sku }} — {{ product.name }}</option>{% endfor %}</select></div>
        <div class="field"><label>Quantidade</label><input name="quantity" type="number" step="0.01" value="1" /></div>
        <div class="field"><label>Desconto %</label><input name="discount_percent" type="number" step="0.01" value="0" /></div>
        <button type="button" class="btn secondary" onclick="removeItemRow(this)">Remover</button>
      </div>
    </div>
    <div style="margin-top:18px;"><button type="submit">Gerar pedido</button></div>
  </form>
</div>
<template id="item-template">
  <div class="item-row">
    <div class="field"><label>Produto</label><select name="product_id">{% for product in products %}<option value="{{ product.id }}">{{ product.sku }} — {{ product.name }}</option>{% endfor %}</select></div>
    <div class="field"><label>Quantidade</label><input name="quantity" type="number" step="0.01" value="1" /></div>
    <div class="field"><label>Desconto %</label><input name="discount_percent" type="number" step="0.01" value="0" /></div>
    <button type="button" class="btn secondary" onclick="removeItemRow(this)">Remover</button>
  </div>
</template>
<script src="/static/js/order_form.js"></script>
{% endblock %}
